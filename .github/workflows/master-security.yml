name: Master isolated security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Expose pinned Supabase CLI to isolated test harness
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Start synthetic local Supabase only
        run: |
          docker network create e0-local-network
          mkdir -p "$RUNNER_TEMP/inmuebles-lab/supabase"
          cp supabase/config.toml "$RUNNER_TEMP/inmuebles-lab/supabase/config.toml"
          npx supabase start --network-id e0-local-network --workdir "$RUNNER_TEMP/inmuebles-lab"
      - name: E0 role authorization regression
        run: python3 tests/security/profile_authorization.py --rebuild
      - name: Master ownership and Storage regression
        run: python3 tests/security/master_ownership.py
      - name: Private image expand Storage regression
        run: PRIVATE_DRAFT_PHASE=A python3 tests/security/private_draft_images.py
      - name: Private image contract Storage regression
        run: PRIVATE_DRAFT_PHASE=B python3 tests/security/private_draft_images.py
      - name: Published private image delivery remediation with Expand
        run: PRIVATE_DRAFT_PHASE=A PRIVATE_IMAGE_REMEDIATION=1 python3 tests/security/private_draft_images.py
      - name: Published private image delivery remediation with future Contract
        run: PRIVATE_DRAFT_PHASE=B PRIVATE_IMAGE_REMEDIATION=1 python3 tests/security/private_draft_images.py
      - name: In-flight legacy draft Contract preflight regression
        run: COMPAT_ONLY=contract-precondition python3 tests/security/private_draft_compatibility.py
      - name: Selective Expand and Contract migration rehearsal
        run: COMPAT_ONLY=selective-migrations python3 tests/security/private_draft_compatibility.py
